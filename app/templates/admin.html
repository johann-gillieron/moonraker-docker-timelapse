<!DOCTYPE html>
<html>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="icon" sizes="512x512" href="{{ url_for('static', filename='icon.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
<head>
    <meta charset="UTF-8">
    <title>Printer Management</title>
    <style>
        body { background:#0f1116; color:#e2e8f0; font-family:sans-serif; padding:20px; }
        .card { background:#1a1d23; padding:20px; border-radius:10px; border:1px solid #2d3748; margin-bottom:20px; }
        input, select { width:100%; padding:8px; background:#0f1116; border:1px solid #2d3748; color:white; border-radius:4px; }
        .btn { background:#3b82f6; padding:10px; border:none; border-radius:4px; color:white; cursor:pointer; }
        .btn-danger { background:#ef4444; }
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th, td { padding:10px; border-bottom:1px solid #2d3748; text-align: left; }
        a { color:#3b82f6; text-decoration:none; }
    </style>
</head>
<body>

<h1>Printers Management</h1>

<div style="display:flex; justify-content:flex-center; margin-bottom: 15px;">
    <a href="/" class="btn" style="text-decoration:none;">DASHBOARD</a>
</div>
<div class="card">
    <h2>Add Printer</h2>
    <form action="/admin/add" method="POST">
        <label>Name (Unique name to recognize the printer)</label>
        <input name="name" required>

        <label>Model (Brand with model)</label>
        <input name="model" required>

        <label>IP (or local address)</label>
        <input name="ip" required>

        <label>Timelapse mode</label>
        <select name="mode">
            <option value="layer">Layer</option>
            <option value="time">Smart Time</option>
        </select>

        <button class="btn" style="margin-top:10px;">Add Printer</button>
    </form>
</div>

<div class="card">
    <h2>Existing Printers</h2>
    <table>
        <tr><th>Name</th><th>Model</th><th>IP</th><th>Timelapse mode</th><th>Actions</th><th>ID</th></tr>
        {% for p in printers %}
        <tr>
            <td>{{p.name}}</td>
            <td>{{p.model}}</td>
            <td>{{p.ip}}</td>
            <td>{{p.mode}}</td>
            <td>
                <a href="/admin/edit/{{p.id}}">Edit</a> |
                <a href="/admin/delete/{{p.id}}" onclick="return confirm('Delete printer?')">Delete</a>
            </td>
            <td>{{p.id}}</td>
        </tr>
        {% endfor %}
    </table>
</div>
<a href="/admin/reload" class="btn">Reload Printers</a>
</body>
</html>
